name: Deploy Briefings to GitHub Pages

# 每次 push 更新到 Daily Briefings/ 就把該資料夾部署成網站根目錄
on:
  push:
    branches: [main]
    paths:
      - "Daily Briefings/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "Daily Briefings"
      - id: deployment
        uses: actions/deploy-pages@v4
