name: Deploy Briefings to GitHub Pages

# 每次 push 更新到 Daily Briefings/ 就把該資料夾部署成網站根目錄
on:
  push:
    branches: [main]
    paths:
      - "Daily Briefings/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "Daily Briefings"
      # Pages 部署 API 偶發 "Deployment failed, try again later."（暫時性錯誤）
      # → 第一次失敗不中止，等 45 秒自動重試一次
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - name: Retry deploy (transient failure)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Fail if both attempts failed
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome != 'success'
        run: exit 1
