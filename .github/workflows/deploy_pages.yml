name: Deploy Briefings to GitHub Pages

# 兩個來源資料夾，內容不混：
#   Daily Briefings/ → 站台根目錄      https://alexpcshao-web.github.io/daily-macro-update/
#   radar/           → /radar/ 子目錄  https://alexpcshao-web.github.io/daily-macro-update/radar/
# 只在部署當下於 CI 的 _site/ 暫存目錄合成，repo 內兩者各自獨立。
on:
  push:
    branches: [main]
    paths:
      - "Daily Briefings/**"
      - "radar/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r "Daily Briefings/." _site/
          if [ -d radar ]; then
            mkdir -p _site/radar
            cp -r radar/. _site/radar/
          fi
          echo "--- _site 根目錄 ---"; ls _site | head -5
          echo "--- _site/radar ---"; ls _site/radar 2>/dev/null || echo "(無 radar)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      # Pages 部署 API 偶發 "Deployment failed, try again later."（暫時性錯誤）
      # → 第一次失敗不中止，等 45 秒自動重試一次
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - name: Retry deploy (transient failure)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Fail if both attempts failed
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome != 'success'
        run: exit 1
